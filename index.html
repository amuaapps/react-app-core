<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Core App - Local Dev</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module">
      import remoteApp from './src/bootstrap.tsx';
      
      // Mount the app for local development
      const container = document.getElementById('root');
      if (container) {
        const result = remoteApp.mount(container, {
          basePath: '/core',
          initialPath: '/core',
          onNavigate: (path) => {
            console.log('Navigation requested:', path);
          },
          contractVersion: '1',
        });
        
        if (!result.success) {
          console.error('Failed to mount app:', result.error);
        }
      }
    </script>
  </body>
</html>
